name: Browser build and tests

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build WebAssembly client and probes
        run: |
          docker run --rm --mount type=bind,source="$PWD",target=/src,readonly \
            --mount type=volume,source=darkeden-web-ci,target=/work \
            --env WEB_BUILD_JOBS=4 \
            emscripten/emsdk:6.0.10@sha256:e077d54e2b8970575ebc4f185ac1de0b95c05f2b266134d4ba27449af7aebf65 \
            bash /src/tools/web/build-container.sh
          mkdir -p build/web
          docker run --rm --mount type=volume,source=darkeden-web-ci,target=/work,readonly \
            --mount type=bind,source="$PWD/build/web",target=/out \
            alpine:3.22 cp -r /work/build-wasm/bin/. /out/
      - name: Assert the vendored server rules' vectors in WebAssembly
        # third_party/decore: the same rows decore_tests asserts natively,
        # from the copy em++ built, under the runner's node.
        run: node build/web/decore_tests.js
      - name: Verify compressed assets and bounded filesystem reads
        run: |
          python3 tests/web/test_compress_assets.py
          node --test tests/web/test_asset_store.mjs
      - name: Check out the compatible production gateway fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bound2/opendarkeden-server
          # The server commit whose gateway fixture matches this client.
          ref: 9cf631b5ca4bc6af90769c737286377d3e2147b5
          path: build/gateway
          sparse-checkout: src/server/websocketproxyserver
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            tools/web/browser-tests
            build/gateway/src/server/websocketproxyserver
      - name: Build the browser test runner and gateway fixture
        run: |
          cargo build --release --locked --manifest-path tools/web/browser-tests/Cargo.toml
          cargo build --release --locked --manifest-path build/gateway/src/server/websocketproxyserver/Cargo.toml --bin client-fixture
      - name: Verify WebGL pixels and binary login/world handoffs
        env:
          WEB_TEST_SOFTWARE_GL: '1'
        run: |
          python3 -m http.server 18739 --bind 127.0.0.1 --directory build/web > build/web-http.log 2>&1 &
          http_pid=$!
          cargo run --release --manifest-path build/gateway/src/server/websocketproxyserver/Cargo.toml --bin client-fixture > build/web-gateway.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$http_pid" "$gateway_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18739/web_sprite_tests.html >/dev/null &&
              (exec 3<>/dev/tcp/127.0.0.1/18740) 2>/dev/null &&
              (exec 3<>/dev/tcp/127.0.0.1/18741) 2>/dev/null; then break; fi
            sleep 1
          done
          cargo run --release --manifest-path tools/web/browser-tests/Cargo.toml -- renderer
          cargo run --release --manifest-path tools/web/browser-tests/Cargo.toml -- touch
          cargo run --release --manifest-path tools/web/browser-tests/Cargo.toml -- transport
      - name: Upload browser build and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-client
          retention-days: 7
          path: |
            build/web/
            build/web-*.log
            web-renderer.log
