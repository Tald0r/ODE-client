name: Linux build and tests

# The job the port assessment asked for twice: without it the non-Windows
# build rots the way the macOS path did between February and August 2026.
# Three presets - GCC, Clang, and GCC under AddressSanitizer and
# UndefinedBehaviorSanitizer - each a full build (every library, the test
# binaries and the DarkEden executable) followed by ctest, through the
# same script a developer runs locally (tools/ci/verify-linux.sh). A
# fourth job, decore-upstream, compares the vendored server rules
# (third_party/decore) with the server's master.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [linux, linux-clang, linux-asan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the toolchain and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build perl \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev \
            libjpeg-dev libfreetype-dev libssl-dev fonts-dejavu-core fonts-noto-cjk

      - name: Configure, build and test
        run: tools/ci/verify-linux.sh ${{ matrix.preset }}

      - name: Package the tested Linux executable
        if: matrix.preset == 'linux'
        run: bash tools/linux/package-ci.sh

      - name: Upload the Linux client
        if: matrix.preset == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: darkeden-client-linux-x64
          retention-days: 30
          if-no-files-found: error
          path: build/packages/darkeden-client-linux-x64.tar.gz

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-${{ matrix.preset }}
          retention-days: 7
          path: |
            build/verification/
            build/presets/${{ matrix.preset }}/Testing/Temporary/
            build/presets/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml

  # Is third_party/decore still what the server's master would sync? A
  # separate job, so a stale copy reads as "vendor behind server" and not
  # as a broken build. It compares bytes and the subset, never the commit
  # recorded in the README: master moves on for changes outside the subset.
  # A failure means: perl tools/decore/sync.pl <server-root>, then commit.
  decore-upstream:
    name: decore-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the server's de-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bound2/opendarkeden-server
          path: build/server
          sparse-checkout: src/domain
          persist-credentials: false
      - name: Compare the vendored copy with server master
        run: perl tools/decore/sync.pl --check build/server
